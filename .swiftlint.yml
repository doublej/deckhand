excluded:
  - .build
  - Packages
  # Parallel agent worktrees. A nested worktree is a second copy of the repo, so without this
  # every file is linted twice and its own .build/ derived sources are linted as if they were
  # ours — which is how a clean tree reports violations in generated code nobody wrote.
  - .worktrees

function_body_length:
  warning: 20
  error: 40

file_length:
  warning: 300
  error: 400

custom_rules:
  bare_nsapp_activate:
    name: "Ineffective NSApp.activate()"
    # macOS 14 cooperative activation: a background or accessory app is never yielded
    # activation, so this call silently does nothing and the window opens behind other
    # apps. See AppActivation.swift for the measurements.
    regex: '\bNSApp(lication\.shared)?\.activate\(\s*\)'
    message: "NSApp.activate() is a no-op for a background/LSUIElement app — use AppActivation.front()"
    severity: error
    excluded_match_kinds:
      - comment
      - doccomment

disabled_rules:
  - todo
  - line_length
