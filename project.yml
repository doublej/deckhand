name: Deckhand
options:
  bundleIdPrefix: com.jj
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  DeckhandKit:
    path: .
targets:
  Deckhand:
    type: application
    platform: iOS
    sources:
      - deckhand
      - deckhand/Assets.xcassets
    dependencies:
      - package: DeckhandKit
        product: DeckhandKit
    info:
      path: deckhand/Info.plist
      properties:
        CFBundleDisplayName: Deckhand
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSMicrophoneUsageDescription: Deckhand records what you say and sends it to your Mac for the session you picked.
        NSLocalNetworkUsageDescription: Deckhand talks to the deckhand daemon on your Mac over the local network.
        NSBonjourServices:
          - _http._tcp
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jj.Deckhand
        DEVELOPMENT_TEAM: KA6433FU8U
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.2"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO
  DeckhandMenu:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - menubar
    dependencies:
      - package: DeckhandKit
        product: DeckhandKit
    info:
      path: menubar/Info.plist
      properties:
        CFBundleDisplayName: Deckhand Menu
        LSUIElement: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jj.DeckhandMenu
        DEVELOPMENT_TEAM: KA6433FU8U
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.2"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
  DeckhandUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: Deckhand
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jj.Deckhand.uitests
        DEVELOPMENT_TEAM: KA6433FU8U
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Deckhand
schemes:
  Deckhand:
    build:
      targets:
        Deckhand: all
        DeckhandUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DeckhandUITests
  DeckhandMenu:
    build:
      targets:
        DeckhandMenu: all
    run:
      config: Debug
