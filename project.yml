name: Deckhand
options:
  bundleIdPrefix: dev.jurrejan
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  createIntermediateGroups: true
packages:
  DeckhandKit:
    path: .
targets:
  Deckhand:
    type: application
    platform: iOS
    sources:
      # Context packets are not resources. Two of them under this target's own root both flatten
      # to `Deckhand.app/CLAUDE.md`, which fails the build outright as "multiple commands produce".
      - path: deckhand
        excludes:
          - "**/CLAUDE.md"
          - "Resources/**"
      # 2.8 MB of JavaScript is a resource and nothing else. Declared on its own because the
      # wholesale include above treats an unknown extension as an *unhandled* file — it warns and
      # does not copy it, so `Bundle.main.url(forResource:)` would answer nil on a device.
      - path: deckhand/Resources
        buildPhase: resources
        excludes:
          - "README.md"
      - deckhand/Assets.xcassets
      # The Lock Screen card's button, compiled into both binaries on purpose. The widget names
      # the App Intent in its `Button`; a `LiveActivityIntent` is *performed* in the app's
      # process, so each side needs the type. Membership in two targets rather than a third
      # module: it is one small file and a package would need `AppIntentsPackage` ceremony.
      - widgets/CardAction.swift
    dependencies:
      - package: DeckhandKit
        product: DeckhandKit
      - target: DeckhandWidgets
    info:
      path: deckhand/Info.plist
      properties:
        CFBundleDisplayName: Deckhand
        NSSupportsLiveActivities: true
        # The daemon is the other half of the same product; one version covers both.
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        # No encryption of its own: plain HTTP to a Mac on your own network. Declared so
        # every upload does not stop to ask the same question.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSMicrophoneUsageDescription: Deckhand records what you say and sends it to your Mac for the session you picked.
        NSLocalNetworkUsageDescription: Deckhand talks to the deckhand daemon on your Mac over the local network.
        # What the app is allowed to browse for. iOS answers a type that is not listed here with
        # silence — no error, no prompt, an empty browse — so `_deckhand._tcp` being here is the
        # whole of whether the pairing screen can find a Mac. It matches `beacon.SERVICE` on the
        # daemon and `Lookout.service` on the phone; all three move together or none do.
        # `_http._tcp` is browsed by nothing in this app (there is no `NWBrowser` outside
        # `Finding/Beacon.swift`), and Apple's local network privacy note says resolving a
        # `.local` *name* is covered by NSLocalNetworkUsageDescription rather than by this list.
        # It is still here because that last sentence has never been tested on a device, and the
        # thing it would break is the app's only working address.
        NSBonjourServices:
          - _deckhand._tcp
          - _http._tcp
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # What makes a tap on a Lock Screen card reach this app. The widget has pointed at
        # `deckhand://` since the card existed and nothing was registered to answer it, so every
        # tap opened the app on the sessions list. `Deck.link` is the other half.
        CFBundleURLTypes:
          - CFBundleURLName: dev.jurrejan.deckhand
            CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - deckhand
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jurrejan.deckhand
        DEVELOPMENT_TEAM: KA6433FU8U
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.2"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CODE_SIGN_ENTITLEMENTS: deckhand/Deckhand.entitlements
  DeckhandWidgets:
    type: app-extension
    platform: iOS
    sources:
      - widgets
    dependencies:
      - package: DeckhandKit
        product: DeckhandKit
    info:
      path: widgets/Info.plist
      properties:
        CFBundleDisplayName: Deckhand
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jurrejan.deckhand.widgets
        DEVELOPMENT_TEAM: KA6433FU8U
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.2"
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
  # The manager and the Lock Screen's cards, for the person at the Mac — see `mac/App.swift`.
  DeckhandMac:
    type: application
    platform: macOS
    sources:
      - path: mac
        excludes:
          - "**/CLAUDE.md"
      # The phone's own conversation lines, compiled into both binaries — the `CardAction.swift`
      # arrangement: two small files with no UIKit in them, so no third module for them either.
      - deckhand/Views/Manager/ManagerLine.swift
      - deckhand/Views/Manager/ManagerStarters.swift
    dependencies:
      - package: DeckhandKit
        product: DeckhandKit
    info:
      path: mac/Info.plist
      properties:
        CFBundleName: Deckhand
        CFBundleDisplayName: Deckhand
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_NAME: Deckhand
        PRODUCT_BUNDLE_IDENTIFIER: dev.jurrejan.deckhand.mac
        DEVELOPMENT_TEAM: KA6433FU8U
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.2"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
  DeckhandUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: Deckhand
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jurrejan.deckhand.uitests
        DEVELOPMENT_TEAM: KA6433FU8U
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Deckhand
schemes:
  Deckhand:
    build:
      targets:
        Deckhand: all
        DeckhandUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DeckhandUITests
  DeckhandMac:
    build:
      targets:
        DeckhandMac: all
    run:
      config: Debug
