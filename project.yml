name: Deckhand
options:
  bundleIdPrefix: dev.jurrejan
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  DeckhandKit:
    path: .
targets:
  Deckhand:
    type: application
    platform: iOS
    sources:
      # Context packets are not resources. Two of them under this target's own root both flatten
      # to `Deckhand.app/CLAUDE.md`, which fails the build outright as "multiple commands produce".
      - path: deckhand
        excludes:
          - "**/CLAUDE.md"
          - "Resources/**"
      # 2.8 MB of JavaScript is a resource and nothing else. Declared on its own because the
      # wholesale include above treats an unknown extension as an *unhandled* file — it warns and
      # does not copy it, so `Bundle.main.url(forResource:)` would answer nil on a device.
      - path: deckhand/Resources
        buildPhase: resources
        excludes:
          - "README.md"
      - deckhand/Assets.xcassets
    dependencies:
      - package: DeckhandKit
        product: DeckhandKit
      - target: DeckhandWidgets
    info:
      path: deckhand/Info.plist
      properties:
        CFBundleDisplayName: Deckhand
        NSSupportsLiveActivities: true
        # The daemon is the other half of the same product; one version covers both.
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        # No encryption of its own: plain HTTP to a Mac on your own network. Declared so
        # every upload does not stop to ask the same question.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSMicrophoneUsageDescription: Deckhand records what you say and sends it to your Mac for the session you picked.
        NSLocalNetworkUsageDescription: Deckhand talks to the deckhand daemon on your Mac over the local network.
        NSBonjourServices:
          - _http._tcp
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jurrejan.deckhand
        DEVELOPMENT_TEAM: KA6433FU8U
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.2"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CODE_SIGN_ENTITLEMENTS: deckhand/Deckhand.entitlements
  DeckhandWidgets:
    type: app-extension
    platform: iOS
    sources:
      - widgets
    dependencies:
      - package: DeckhandKit
        product: DeckhandKit
    info:
      path: widgets/Info.plist
      properties:
        CFBundleDisplayName: Deckhand
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jurrejan.deckhand.widgets
        DEVELOPMENT_TEAM: KA6433FU8U
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.2"
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
  DeckhandWidgets:
    type: app-extension
    platform: iOS
    sources:
      - widgets
    dependencies:
      - package: DeckhandKit
        product: DeckhandKit
    info:
      path: widgets/Info.plist
      properties:
        CFBundleDisplayName: Deckhand
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jurrejan.deckhand.widgets
        DEVELOPMENT_TEAM: KA6433FU8U
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.2"
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
  DeckhandUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: Deckhand
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jurrejan.deckhand.uitests
        DEVELOPMENT_TEAM: KA6433FU8U
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Deckhand
schemes:
  Deckhand:
    build:
      targets:
        Deckhand: all
        DeckhandUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DeckhandUITests
