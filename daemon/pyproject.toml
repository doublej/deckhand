[project]
name = "deckhand-daemon"
version = "0.1.0"
description = "Serves live Claude Code sessions running in iTerm to the Deckhand iOS app"
authors = [{ name = "Jurre-Jan Smit" }]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.0",
    "uvicorn[standard]>=0.52.0",
    "python-multipart>=0.0.20",
    "claude-agent-sdk>=0.2.152,<0.3",
    "httpx[http2]>=0.28.1",
    "pyjwt[crypto]>=2.13.0",
    "pyyaml>=6.0.3",
    "mcp>=2.0.0",
    "websockets>=17.1",
]

[project.scripts]
deckhand-daemon = "deckhand_daemon:main"
deckhand-mcp = "deckhand_daemon.mcp.server:main"
deckhand-control-mcp = "deckhand_daemon.mcp.manager:main"
deckhand = "deckhand_daemon.mcp.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "httpx>=0.28.0",
    "ruff>=0.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deckhand_daemon"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
